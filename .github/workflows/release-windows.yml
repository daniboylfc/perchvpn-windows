name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "2.0.3"
  PRODUCT_NAME: "PerchVPN"
  MANUFACTURER: "Vauth"
  SING_BOX_VERSION: "1.14.4"
  WINTUN_VERSION: "0.14.1"
  SING_BOX_SHA256: "8F30682EE198855440D2A7FE070D5D3653793B2D01BB8C85EEA88F93BBE7C8B9"
  WINTUN_SHA256: "E5DA8447DC2C320EDC0FC52FA01885C103DE8C118481F683643CACC3220DAFCE"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Create build venv
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "perchvenv"
          python -m venv $venv
          & (Join-Path $venv "Scripts\python.exe") -m pip install --upgrade pip
          & (Join-Path $venv "Scripts\pip.exe") install -e . pyinstaller==6.22.3

      - name: Fetch pinned runtime sidecars
        run: |
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force bin | Out-Null

          $singBoxZip = Join-Path $env:RUNNER_TEMP "sing-box.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/SagerNet/sing-box/releases/download/v${env:SING_BOX_VERSION}/sing-box-${env:SING_BOX_VERSION}-windows-amd64.zip" `
            -OutFile $singBoxZip
          Expand-Archive -LiteralPath $singBoxZip -DestinationPath (Join-Path $env:RUNNER_TEMP "sing-box") -Force
          $singBox = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "sing-box") -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          Copy-Item -LiteralPath $singBox.FullName -Destination "bin\sing-box.exe" -Force

          $wintunZip = Join-Path $env:RUNNER_TEMP "wintun.zip"
          Invoke-WebRequest `
            -Uri "https://www.wintun.net/builds/wintun-${env:WINTUN_VERSION}.zip" `
            -OutFile $wintunZip
          Expand-Archive -LiteralPath $wintunZip -DestinationPath (Join-Path $env:RUNNER_TEMP "wintun") -Force
          $wintun = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "wintun") -Recurse -Filter "wintun.dll" |
            Where-Object { $_.FullName -match "\\amd64\\" } |
            Select-Object -First 1
          Copy-Item -LiteralPath $wintun.FullName -Destination "bin\wintun.dll" -Force

          $singBoxHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "bin\sing-box.exe").Hash
          $wintunHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "bin\wintun.dll").Hash
          if ($singBoxHash -ne $env:SING_BOX_SHA256) {
            throw "sing-box SHA-256 mismatch: $singBoxHash"
          }
          if ($wintunHash -ne $env:WINTUN_SHA256) {
            throw "wintun SHA-256 mismatch: $wintunHash"
          }

      - name: Build portable bundle
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "perchvenv"
          $dist = Join-Path $env:GITHUB_WORKSPACE "build\dist"
          $work = Join-Path $env:GITHUB_WORKSPACE "build\work"
          $spec = Join-Path $env:GITHUB_WORKSPACE "build\spec"
          .\scripts\build-candidate.ps1 `
            -Project $env:GITHUB_WORKSPACE `
            -Venv $venv `
            -DistPath $dist `
            -WorkPath $work `
            -SpecPath $spec `
            -NoUpx

          $exe = Join-Path $dist "PerchVPN\PerchVPN.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Portable EXE missing: $exe"
          }
          $version = & $exe --version 2>&1 | Out-String
          if ($version.Trim() -ne "perchvpn $env:VERSION") {
            throw "Unexpected --version output: $version"
          }

      - name: Hygiene check and package portable ZIP
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "build\dist\PerchVPN"
          $artifacts = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force $artifacts | Out-Null

          $forbidden = Get-ChildItem -LiteralPath $bundle -Recurse -Force -File |
            Where-Object {
              $_.Name -in @("auth.json", "tokens.json", "settings.json", ".env") -or
              $_.Extension -eq ".log"
            }
          if ($forbidden) {
            $forbidden.FullName
            throw "Forbidden personal/log files found in the portable bundle"
          }

          $portable = Join-Path $artifacts "PerchVPN-${env:VERSION}-win64-portable.zip"
          Compress-Archive -Path $bundle -DestinationPath $portable -CompressionLevel Optimal -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($portable)
          if ($zip.Entries[0].FullName -notmatch '^PerchVPN[\\/]') {
            throw "Portable ZIP is missing the top-level PerchVPN folder"
          }
          $zipForbidden = $zip.Entries | Where-Object {
            $_.Name -in @("auth.json", "tokens.json", "settings.json", ".env") -or
            $_.Name -like "*.log"
          }
          $zip.Dispose()
          if ($zipForbidden) {
            throw "Forbidden personal/log files found in the portable ZIP"
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP "portable-verify"
          Expand-Archive -LiteralPath $portable -DestinationPath $verifyDir -Force
          $extractedExe = Join-Path $verifyDir "PerchVPN\PerchVPN.exe"
          $extractedVersion = & $extractedExe --version 2>&1 | Out-String
          if ($extractedVersion.Trim() -ne "perchvpn $env:VERSION") {
            throw "Extracted portable --version failed: $extractedVersion"
          }
          Remove-Item -LiteralPath $verifyDir -Recurse -Force

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          $tools = Join-Path $env:USERPROFILE ".dotnet\tools"
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          & (Join-Path $tools "wix.exe") --version

      - name: Build MSI
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "build\dist\PerchVPN"
          $msi = Join-Path $env:GITHUB_WORKSPACE "artifacts\PerchVPN-${env:VERSION}-win64.msi"
          wix build installer\PerchVPN.wxs `
            -arch x64 `
            -bindpath "SourceDir=$bundle" `
            -d "Version=$env:VERSION" `
            -d "ProductName=$env:PRODUCT_NAME" `
            -d "Manufacturer=$env:MANUFACTURER" `
            -o $msi
          if (-not (Test-Path -LiteralPath $msi)) {
            throw "MSI missing: $msi"
          }
          $size = (Get-Item -LiteralPath $msi).Length
          if ($size -le 0) {
            throw "MSI is empty: $msi"
          }

      - name: Generate SHA256SUMS
        run: |
          $artifacts = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          $files = @(
            (Join-Path $artifacts "PerchVPN-${env:VERSION}-win64-portable.zip"),
            (Join-Path $artifacts "PerchVPN-${env:VERSION}-win64.msi")
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content -LiteralPath (Join-Path $artifacts "SHA256SUMS.txt") -Encoding ascii
          Get-Content -LiteralPath (Join-Path $artifacts "SHA256SUMS.txt")

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PerchVPN-2.0.3-win64
          path: artifacts/*
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            (Join-Path $env:GITHUB_WORKSPACE "artifacts\PerchVPN-${env:VERSION}-win64-portable.zip"),
            (Join-Path $env:GITHUB_WORKSPACE "artifacts\PerchVPN-${env:VERSION}-win64.msi"),
            (Join-Path $env:GITHUB_WORKSPACE "artifacts\SHA256SUMS.txt")
          )
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "PerchVPN $tag" --notes "Windows portable and MSI release for $tag."
          }
          gh release upload $tag @assets --clobber
