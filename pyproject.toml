[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perchvpn-windows"
version = "2.0.4"
description = "Local SOCKS5 proxy client for the Mozilla VPN / Firefox VPN proxy service (Windows port)"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vauth" }]
keywords = ["vpn", "proxy", "socks5", "mozilla-vpn", "firefox-vpn", "http2", "http3", "quic", "windows"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
dependencies = [
    "httpx[socks]>=0.27",
    "curl_cffi>=0.7",
    "h2>=4.1",
    "cryptography>=42.0",
    "aioquic>=1.0",
    "certifi>=2023.7.22",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "twine>=5.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
gui = [
    "pywebview>=5.0",
]

[project.scripts]
perchvpn = "perchvpn_windows.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["perchvpn*"]

[tool.setuptools.package-data]
perchvpn_windows = ["web/*.js", "web/*.html", "web/*.css", "web/**/*"]

[tool.setuptools.package-dir]
"" = "src"